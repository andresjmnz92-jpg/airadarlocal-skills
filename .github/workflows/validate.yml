name: Validate skills release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check source skills, ZIP packages, and marketplace pins
        run: python scripts/validate_release.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate Claude Code marketplace
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.332
          claude plugin validate .
